[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-lab"
version = "0.1.0"
description = "Laboratorio educativo de RAG y trazabilidad reproducible"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
embeddings = ["onnxruntime==1.30.0", "tokenizers==0.23.2", "numpy==2.5.3"]

[tool.setuptools.packages.find]
where = ["src"]
